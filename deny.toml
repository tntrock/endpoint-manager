[advisories]
version = 2
yanked = "deny"
ignore = [
    # basic-toml unmaintained; only used at compile time by askama_derive (latest askama 0.16.1). Drop once askama switches to toml.
    { id = "RUSTSEC-2026-0374", reason = "compile-time only via askama_derive, no upgrade available" },
]

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0", "GPL-3.0-only",
]

[bans]
multiple-versions = "warn"
deny = [{ name = "openssl" }, { name = "openssl-sys" }, { name = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
