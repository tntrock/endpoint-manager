[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono unmaintained (chronotope/chrono#1768); used by every crate and by sqlx's chrono types. Drop once migrated to jiff or time.
    { id = "RUSTSEC-2026-0543", reason = "no maintained drop-in; migration is a separate change" },
]

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0", "GPL-3.0-only",
]

[bans]
multiple-versions = "warn"
deny = [{ name = "openssl" }, { name = "openssl-sys" }, { name = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
