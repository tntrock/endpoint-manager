name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --cobertura --output-path coverage.xml
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  agent-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p endpoint-agent --lib --test windows
      - run: cargo test -p endpoint-cache --lib

  agent-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - run: sh packaging/linux/build.sh
      - name: 靜態連結檢查
        run: file target/x86_64-unknown-linux-musl/release/endpoint-agent | grep 'statically linked'
      - name: deb 安裝
        run: |
          sudo dpkg -i target/linux-release/endpoint-agent_*_amd64.deb
          test -x /usr/bin/endpoint-agent
          test "$(systemctl is-enabled endpoint-agent)" = enabled
          # 尚未 configure，不應啟動
          ! systemctl is-active --quiet endpoint-agent
      - name: deb 升級
        run: sudo dpkg -i target/linux-release/endpoint-agent_*_amd64.deb
      - name: deb 移除
        run: |
          sudo mkdir -p /var/lib/endpoint-manager
          sudo touch /var/lib/endpoint-manager/config.json
          sudo dpkg -r endpoint-agent
          test ! -e /var/lib/endpoint-manager
          test ! -e /usr/bin/endpoint-agent
      - name: rpm 安裝與移除（rockylinux:9）
        run: >
          docker run --rm -v "$PWD/target/linux-release:/pkg" rockylinux:9 bash -c
          "rpm -i /pkg/*.rpm && test -x /usr/bin/endpoint-agent && rpm -e endpoint-agent && test ! -e /usr/bin/endpoint-agent"
      - uses: actions/upload-artifact@v7
        with:
          name: agent-linux
          path: target/linux-release/

  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: dotnet tool install --global wix --version 5.0.2
      - name: build, patch and test MSI
        shell: pwsh
        run: |
          cargo build --release -p endpoint-server -p endpoint-cache
          ./target/release/endpoint-server.exe ca-init target/ci-pki localhost
          ./installer/build.ps1 -Out target/template.msi
          ./installer/build.ps1 -Version 255.0.0 -Out target/upgrade.msi   # 永遠比目前版本新
          $env:EM_CA_DIR = "target/ci-pki"
          ./target/release/endpoint-server.exe agent-msi target/template.msi target/a.msi https://localhost:9 ci-secret-token-8f3a
          ./target/release/endpoint-server.exe agent-msi target/template.msi target/b.msi https://localhost:10 ci-second-token-2c7e
          ./installer/test-msi.ps1 -Msi target/a.msi -Msi2 target/b.msi -UpgradeMsi target/upgrade.msi -Token ci-secret-token-8f3a -Token2 ci-second-token-2c7e -RootPem target/ci-pki/root.pem
      - uses: actions/upload-artifact@v7
        with:
          name: agent-msi
          path: |
            target/template.msi
            target/release/endpoint-agent.exe
            target/release/endpoint-cache.exe
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: msi-logs
          path: "*.log"

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash deploy/smoke.sh
      - run: docker build -f deploy/cache.Dockerfile -t endpoint-cache .
