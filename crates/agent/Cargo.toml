[package]
name = "endpoint-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "endpoint_agent"

[dependencies]
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
rustls.workspace = true
rcgen.workspace = true
flate2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
sha2.workspace = true
hex.workspace = true
x509-parser.workspace = true

[target.'cfg(windows)'.dependencies]
wmi = "0.18"
winreg = "0.56"
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_NetManagement",
    "Win32_System_Registry",
    "Win32_System_EventLog",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
endpoint-server = { path = "../server" }
axum.workspace = true
endpoint-cache = { path = "../cache" }
futures-util = "0.3"
bytes = "1"
sqlx.workspace = true
tempfile.workspace = true
chrono.workspace = true
rcgen.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dev-dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_System_EventLog", "Win32_System_Registry"] }

[package.metadata.deb]
name = "endpoint-agent"
maintainer = "tntrock <a940125@gmail.com>"
copyright = "tntrock"
section = "admin"
priority = "optional"
extended-description = "Endpoint Manager Linux agent: reports inventory and runs commands from the management server."
assets = [
    ["target/release/endpoint-agent", "usr/bin/", "755"],
    ["../../packaging/linux/endpoint-agent.service", "lib/systemd/system/", "644"],
]
maintainer-scripts = "../../packaging/linux/"

[package.metadata.generate-rpm]
name = "endpoint-agent"
summary = "Endpoint Manager Linux agent"
assets = [
    { source = "target/release/endpoint-agent", dest = "/usr/bin/endpoint-agent", mode = "755" },
    { source = "packaging/linux/endpoint-agent.service", dest = "/usr/lib/systemd/system/endpoint-agent.service", mode = "644" },
]
post_install_script = """
systemctl daemon-reload || true
systemctl enable endpoint-agent || true
if [ "$1" -ge 2 ]; then
    systemctl try-restart endpoint-agent || true
fi
"""
pre_uninstall_script = """
if [ "$1" -eq 0 ]; then
    systemctl stop endpoint-agent || true
    /usr/bin/endpoint-agent unconfigure || true
    systemctl disable endpoint-agent || true
fi
"""
