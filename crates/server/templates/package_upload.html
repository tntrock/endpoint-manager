{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><div class="crumb"><a href="/deployments">派送</a> ／ <a href="/packages">套件</a> ／ 上傳</div><h1>上傳套件</h1></div></div>
<form class="card" id="upload-form" data-csrf="{{ nav.csrf }}">
  <p><input type="file" name="file" accept=".msi,.exe" required aria-label="套件檔案"></p>
  <div class="actions"><button class="btn primary">上傳</button> <span id="upload-status" class="muted"></span></div>
  <p class="muted">只接受 .msi 或 .exe，單檔最大 2 GiB。MSI 會自動讀出名稱、版本、發行者與 ProductCode；上傳後請到下一頁確認偵測規則，EXE 請填靜默安裝參數。</p>
</form>
<script src="/static/upload.js" defer></script>
{% endblock %}
