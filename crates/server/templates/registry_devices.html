{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div><div class="crumb"><a href="/registry?path={{ path|urlencode }}&name={{ name|urlencode }}">登錄檔</a> ／ 裝置清單</div><h1>登錄檔值：裝置清單</h1>
  <div class="sub"><code>{{ path }}\{{ name }}</code>：{{ state }}，值 <code>{{ data }}</code></div></div>
</div>
<table>
  <tr><th>主機名稱</th><th>裝置 ID</th></tr>
  {% for r in rows %}<tr><td><a href="/devices/{{ r.0 }}">{{ r.1 }}</a></td><td><span class="num">{{ r.0 }}</span></td></tr>{% endfor %}
</table>
{% if truncated %}<p class="muted">只顯示前 500 台。</p>{% endif %}
{% endblock %}
