{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>稽核記錄</h1><div class="sub">管理操作的記錄，新的在前</div></div></div>
<table>
  <tr><th>時間</th><th>操作者</th><th>動作</th><th>對象</th><th>細節</th></tr>
  {% for r in rows %}<tr><td class="num">{{ r.at }}</td><td>{{ r.actor }}</td><td>{{ r.action }}</td><td>{{ r.target }}</td><td class="muted">{{ r.detail }}</td></tr>{% endfor %}
</table>
<div class="pager">
  {% if page > 0 %}<a class="btn sm" href="/audit?page={{ page - 1 }}">← 上一頁</a>{% endif %}
  <span class="num">第 {{ page + 1 }} 頁</span>
  {% if has_next %}<a class="btn sm" href="/audit?page={{ page + 1 }}">下一頁 →</a>{% endif %}
</div>
{% endblock %}
