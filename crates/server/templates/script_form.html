{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><div class="crumb"><a href="/scripts">腳本</a> ／ {% if id.is_some() %}編輯{% else %}建立{% endif %}</div><h1>{% if id.is_some() %}編輯腳本{% else %}建立腳本{% endif %}</h1></div></div>
{% if let Some(e) = error %}<div class="notice error">{{ e }}</div>{% endif %}
<form class="card" method="post" action="{% if let Some(i) = id %}/scripts/{{ i }}/edit{% else %}/scripts{% endif %}">
  <input type="hidden" name="csrf" value="{{ nav.csrf }}">
  <label class="field">名稱 <input name="name" value="{{ f.name }}" required maxlength="100" size="40"></label>
  <label class="field">說明<textarea name="description" rows="3" cols="80" maxlength="1000">
{{ f.description }}</textarea></label>
  <label class="field">內容（PowerShell，以 SYSTEM 執行，最多 64 KiB）<textarea name="content" rows="20" cols="100" class="code" required>
{{ f.content }}</textarea></label>
  <label class="field">逾時 <input name="timeout_minutes" value="{{ f.timeout_minutes }}" inputmode="numeric" size="4"> 分鐘（1–120）</label>
  <p class="muted">改了內容或逾時就要重新核准。腳本可能因 Agent 狀態檔遺失而重跑，請設計成可以重複執行。</p>
  <button class="btn primary">{% if id.is_some() %}儲存{% else %}建立{% endif %}</button>
</form>
{% endblock %}
