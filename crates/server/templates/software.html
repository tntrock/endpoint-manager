{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>軟體</h1><div class="sub">依名稱搜尋各版本的安裝台數</div></div></div>
<form class="filters" method="get" action="/software">
  <input name="q" value="{{ q }}" placeholder="軟體名稱（例如 Chrome）" aria-label="軟體名稱" autofocus>
  <button class="btn primary">搜尋</button>
</form>
{% if !q.is_empty() %}
<table>
  <tr><th>名稱</th><th>版本</th><th class="num">安裝台數</th></tr>
  {% for r in rows %}<tr><td>{{ r.name }}</td><td>{{ r.version }}</td><td class="num"><a href="{{ r.url }}">{{ r.count }}</a></td></tr>{% endfor %}
</table>
{% if truncated %}<p class="muted">結果過多，只顯示前 500 筆，請縮小搜尋範圍。</p>{% endif %}
{% endif %}
{% endblock %}
