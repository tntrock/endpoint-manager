{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>變更密碼</h1></div></div>
{% if let Some(msg) = message %}<div class="notice ok">{{ msg }}</div>{% endif %}
{% if let Some(e) = error %}<div class="notice error">{{ e }}</div>{% endif %}
<form class="card login-box" method="post" action="/password">
  <input type="hidden" name="csrf" value="{{ nav.csrf }}">
  <label class="field">目前密碼 <input name="current" type="password" required autocomplete="current-password"></label>
  <label class="field">新密碼（至少 12 字元） <input name="new" type="password" required minlength="12" autocomplete="new-password"></label>
  <label class="field">確認新密碼 <input name="confirm" type="password" required minlength="12" autocomplete="new-password"></label>
  <button class="btn primary">修改</button>
</form>
{% endblock %}
